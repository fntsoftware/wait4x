      - name: Build and push Alpine image
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          targets: image-alpine
          push: ${{ env.SHOULD_PUBLISH }}
          sbom: true
          provenance: true
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta-alpine.outputs.bake-file }}
          set: |
            *.args.COMMIT_HASH=${{ github.sha }}
            *.args.COMMIT_REF_SLUG=${{ github.ref_name }}

      # The BSI SBOM reads the image from the runner. A pushed image is pulled, so it has the registry digest
      # for its purl; otherwise the amd64 image is loaded from the build cache.
      - name: Pull Alpine image for the SBOM
        if: ${{ env.SHOULD_PUBLISH == 'true' }}
        run: docker pull "$SBOM_IMAGE"

      - name: Load Alpine image for the SBOM
        if: ${{ env.SHOULD_PUBLISH != 'true' }}
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          targets: image-alpine
          load: true
          provenance: false
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta-alpine.outputs.bake-file }}
          set: |
            *.platform=linux/amd64
            *.tags=${{ env.SBOM_IMAGE }}
            *.args.COMMIT_HASH=${{ github.sha }}
            *.args.COMMIT_REF_SLUG=${{ github.ref_name }}

      - name: BSI Compliant SBOM
        uses: fntsoftware/actions/bsi-compliant-sbom@v1
        with:
          image: ${{ env.SBOM_IMAGE }}
          publish: ${{ env.SHOULD_PUBLISH }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cosign-public-key: ${{ secrets.COSIGN_PUBLIC_KEY }}
          cosign-private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign-private-key-password: ${{ secrets.COSIGN_PASSWORD }}

