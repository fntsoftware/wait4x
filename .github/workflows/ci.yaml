  build:
    name: Build
# bsi-fast:     needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      statuses: write
    env:
      SHOULD_PUBLISH: ${{ github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Docker metadata (Alpine)
        id: meta-alpine
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Maintaining "atkrad/wait4x" for backward compatibility
          # Note: This will be removed in v4.0.0. Please use the "wait4x/wait4x" image going forward.
          images: |
            ghcr.io/${{ github.repository }}
          # atkrad/wait4x
          # wait4x/wait4x
          ### versioning strategy
          ### push semver tag v3.2.1 on the default branch
          # wait4x/wait4x:3.2.0
          # wait4x/wait4x:3.2
          # wait4x/wait4x:3
          # wait4x/wait4x:latest
          # ghcr.io/wait4x/wait4x:3.2.0
          # ghcr.io/wait4x/wait4x:3.2
          # ghcr.io/wait4x/wait4x:3
          # ghcr.io/wait4x/wait4x:latest
          ### push semver pre-release tag v3.0.0-beta.1 on the default branch
          # wait4x/wait4x:3.0.0-beta.1
          # ghcr.io/wait4x/wait4x:3.0.0-beta.1
          ### push on the default branch
          # wait4x/wait4x:edge
          # ghcr.io/wait4x/wait4x:edge
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
            type=edge,branch=${{ github.event.repository.default_branch }}
          # OCI labels the BSI SBOM reads (PLAT-7643); title, version, source and revision come from the action
          labels: |
            org.opencontainers.image.vendor=FNT Software GmbH
            org.opencontainers.image.authors=licensing@fntsoftware.com
            org.opencontainers.image.licenses=Apache-2.0 AND LicenseRef-fntsoftware-EULA-2025-09

      # The SBOM version is the image tag; a branch without one gets a snapshot tag.
      - name: SBOM image reference
        env:
          VERSION: ${{ steps.meta-alpine.outputs.version }}
        run: echo "SBOM_IMAGE=ghcr.io/${GITHUB_REPOSITORY}:${VERSION:-${GITHUB_SHA::7}-SNAPSHOT}" >> "$GITHUB_ENV"

      # - name: Docker metadata (Debian)
