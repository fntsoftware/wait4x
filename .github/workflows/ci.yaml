# bsi-fast:           find ./dist -type f -not -name "SHA256SUMS" -exec mv {} ./dist/ \;
# bsi-fast:           # Combine all SHA256SUMS files into one
# bsi-fast:           find ./dist -name "SHA256SUMS" -exec cat {} \; | sort -u > ./dist/SHA256SUMS.combined
# bsi-fast:           mv ./dist/SHA256SUMS.combined ./dist/SHA256SUMS
