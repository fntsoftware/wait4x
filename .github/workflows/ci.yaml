      #       type=raw,value=debian,enable={{is_default_branch}},suffix=
      #       type=raw,value=debian,enable=${{ startsWith(github.ref, 'refs/tags/v') }},suffix=
      #       type=semver,pattern={{version}}
      #       type=semver,pattern={{major}}.{{minor}}
      #       type=semver,pattern={{major}}
      #       type=ref,event=pr
