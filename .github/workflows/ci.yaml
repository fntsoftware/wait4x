name: Wait4X CI

on:
  push:
    branches:
      - 'main'
      - 'fnt'
      - 'release/*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
